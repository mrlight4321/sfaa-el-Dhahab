<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض عطور صفاء الذهب</title>
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Cairo', Tahoma, sans-serif;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        header h1 {
            color: #d4af37;
            font-size: 24px;
            margin: 0;
        }

        #admin-login-btn {
            background-color: transparent;
            color: #888;
            border: 1px dashed #555;
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        #admin-login-btn:hover {
            color: #d4af37;
            border-color: #d4af37;
        }

        .gallery-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .perfume-card {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            width: 280px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        .image-box {
            width: 100%;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #222;
            border-radius: 5px;
            overflow: hidden;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .perfume-title {
            color: #d4af37;
            font-size: 18px;
            margin: 15px 0 5px 0;
            text-align: center;
        }

        .admin-controls {
            display: none;
            width: 100%;
            margin-top: 15px;
        }

        body.admin-mode .admin-controls {
            display: block;
        }

        .delete-btn {
            width: 100%;
            background-color: #a02622;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .delete-btn:hover {
            background-color: #c9302c;
        }
    </style>
</head>
<body>

    <header>
        <h1>معرض عطور صفاء الذهب</h1>
        <button id="admin-login-btn" onclick="openAdminMode()">دخول المشرفين</button>
    </header>

    <main class="gallery-container" id="perfumes-container">
        <!-- الكارت الأول -->
        <div class="perfume-card" id="card-1">
            <div class="image-box">
                <img src="perfume8.jpg" alt="عطر صفاء الذهب (8)" onerror="this.src='https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=300&auto=format&fit=crop&q=60'">
            </div>
            <div class="perfume-title">عطر صفاء الذهب (8)</div>
            <div class="admin-controls">
                <button class="delete-btn" onclick="removeCard('card-1')">حذف العطر</button>
            </div>
        </div>

        <!-- الكارت الثاني -->
        <div class="perfume-card" id="card-2">
            <div class="image-box">
                <img src="perfume9.jpg" alt="عطر صفاء الذهب (9)" onerror="this.src='https://images.unsplash.com/photo-1594035910387-fea47794261f?w=300&auto=format&fit=crop&q=60'">
            </div>
            <div class="perfume-title">عطر صفاء الذهب (9)</div>
            <div class="admin-controls">
                <button class="delete-btn" onclick="removeCard('card-2')">حذف العطر</button>
            </div>
        </div>

        <!-- الكارت الثالث -->
        <div class="perfume-card" id="card-3">
            <div class="image-box">
                <img src="perfume10.jpg" alt="عطر صفاء الذهب (10)" onerror="this.src='https://images.unsplash.com/photo-1547887537-6158d64c35b3?w=300&auto=format&fit=crop&q=60'">
            </div>
            <div class="perfume-title">عطر صفاء الذهب (10)</div>
            <div class="admin-controls">
                <button class="delete-btn" onclick="removeCard('card-3')">حذف العطر</button>
            </div>
        </div>
    </main>

    <script>
        const ADMIN_PASSWORD = "اشراف صفاء الدهب";

        function openAdminMode() {
            let pass = prompt("الرجاء إدخال كلمة مرور المشرف:");
            if (pass === ADMIN_PASSWORD) {
                document.body.classList.add('admin-mode');
                document.getElementById('admin-login-btn').textContent = "وضع الإشراف مفعل";
                document.getElementById('admin-login-btn').style.color = "#d4af37";
                document.getElementById('admin-login-btn').style.borderColor = "#d4af37";
                alert("تم تسجيل الدخول بنجاح.");
            } else if (pass !== null) {
                alert("كلمة المرور غير صحيحة!");
            }
        }

        function removeCard(cardId) {
            if (confirm('هل أنت متأكد من حذف هذا العطر؟')) {
                document.getElementById(cardId).style.display = 'none';
                alert('تم الحذف من الشاشة. لتثبيته نهائياً للزوار، قم بحذف الكارت الخاص به من ملف index.html في جيت هب.');
            }
        }
    </script>
</body>
</html>
