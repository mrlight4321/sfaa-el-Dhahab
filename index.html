<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض عطور صفاء الذهب</title>
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Cairo', Tahoma, sans-serif;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        header h1 {
            color: #d4af37;
            font-size: 24px;
            margin: 0;
        }

        #admin-login-btn {
            background-color: transparent;
            color: #888;
            border: 1px dashed #555;
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        #admin-login-btn:hover {
            color: #d4af37;
            border-color: #d4af37;
        }

        .gallery-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .perfume-card {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            width: 280px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        .image-box {
            width: 100%;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #222;
            border-radius: 5px;
        }

        .image-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
            border-radius: 5px;
        }

        .perfume-title {
            color: #d4af37;
            font-size: 18px;
            margin: 15px 0 5px 0;
            text-align: center;
        }

        .admin-controls {
            display: none;
            width: 100%;
            margin-top: 15px;
        }

        body.admin-mode .admin-controls {
            display: block;
        }

        .delete-btn {
            width: 100%;
            background-color: #a02622;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .delete-btn:hover {
            background-color: #c9302c;
        }

        .loading {
            text-align: center;
            color: #d4af37;
            font-size: 18px;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>معرض عطور صفاء الذهب</h1>
        <button id="admin-login-btn" onclick="openAdminMode()">دخول المشرفين</button>
    </header>

    <main class="gallery-container" id="perfumes-container">
        <div class="loading">جاري تحميل العطور...</div>
    </main>

    <script>
        const GITHUB_USERNAME = "mrlight4321"; 
        const REPO_NAME = "sfaa-el-Dhahab";         
        const FILE_PATH = "index.html";          
        const GITHUB_TOKEN = "ضع_التوكن_هنا_بين_العلامتين"; // ضع التوكن الخاص بك هنا
        const ADMIN_PASSWORD = "اشراف صفاء الدهب";         

        // قائمة العطور الافتراضية المدمجة مباشرة لضمان ظهورها فوراً
        let perfumes = [
            { id: 8, title: "عطر صفاء الذهب (8)", image: "perfume8.jpg" },
            { id: 9, title: "عطر صفاء الذهب (9)", image: "perfume9.jpg" },
            { id: 10, title: "عطر صفاء الذهب (10)", image: "perfume10.jpg" }
        ];

        let fileSha = ""; 

        function renderPerfumes() {
            const container = document.getElementById('perfumes-container');
            if (perfumes.length === 0) {
                container.innerHTML = '<div class="loading">لا توجد عطور متاحة حالياً في المعرض.</div>';
                return;
            }

            let html = '';
            perfumes.forEach(p => {
                html += `
                    <div class="perfume-card" data-id="${p.id}">
                        <div class="image-box">
                            <img src="${p.image}" alt="${p.title}" onerror="this.src='https://via.placeholder.com/250x300?text=Perfume'">
                        </div>
                        <div class="perfume-title">${p.title}</div>
                        <div class="admin-controls">
                            <button class="delete-btn" onclick="deletePerfume(${p.id})">حذف العطر</button>
                        </div>
                    </div>
                `;
            });
            container.html = container.innerHTML = html; // للتأكيد
            container.innerHTML = html;
        }

        function openAdminMode() {
            let pass = prompt("الرجاء إدخال كلمة مرور المشرف:");
            if (pass === ADMIN_PASSWORD) {
                document.body.classList.add('admin-mode');
                document.getElementById('admin-login-btn').textContent = "وضع الإشراف مفعل";
                document.getElementById('admin-login-btn').style.color = "#d4af37";
                document.getElementById('admin-login-btn').style.borderColor = "#d4af37";
                alert("تم تسجيل الدخول بنجاح.");
            } else if (pass !== null) {
                alert("كلمة المرور غير صحيحة!");
            }
        }

        async function deletePerfume(id) {
            if (!confirm('هل أنت متأكد من رغبتك في حذف هذا العطر نهائياً؟')) return;

            let updatedPerfumes = perfumes.filter(p => p.id !== id);

            try {
                let shaRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    headers: { "Authorization": `token ${GITHUB_TOKEN}` }
                });
                
                if (shaRes.ok) {
                    let fileData = await shaRes.json();
                    fileSha = fileData.sha;
                }

                // ملاحظة: بما أننا نحدث ملف index.html نفسه، سنقوم بتحديث مصفوفة العطور المدمجة في الكود تلقائياً عبر الـ API!
                // لكن للأمان والسرعة، سنجعل الحذف يحدث محلياً أولاً لتشاهد النتيجة، ثم نربطه بالـ API.
                perfumes = updatedPerfumes;
                renderPerfumes();
                alert('تم حذف العطر بنجاح!');

            } catch (err) {
                console.error(err);
                alert('حدث خطأ أثناء الاتصال.');
            }
        }

        window.onload = function() {
            renderPerfumes();
        };
    </script>
</body>
</html>
