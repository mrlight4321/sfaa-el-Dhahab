<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض عطور صفاء الذهب</title>
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Cairo', Tahoma, sans-serif;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        header h1 {
            color: #d4af37;
            font-size: 24px;
            margin: 0;
        }

        #admin-login-btn {
            background-color: transparent;
            color: #888;
            border: 1px dashed #555;
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        #admin-login-btn:hover {
            color: #d4af37;
            border-color: #d4af37;
        }

        .gallery-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .perfume-card {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            width: 280px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        .image-box {
            width: 100%;
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
            border-radius: 5px;
        }

        /* أزرار الإشراف مخفية تماماً عن الزوار */
        .admin-controls {
            display: none;
            width: 100%;
            margin-top: 15px;
        }

        body.admin-mode .admin-controls {
            display: block;
        }

        .delete-btn {
            width: 100%;
            background-color: #a02622;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .delete-btn:hover {
            background-color: #c9302c;
        }

        .loading {
            text-align: center;
            color: #d4af37;
            font-size: 18px;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>معرض عطور صفاء الذهب</h1>
        <button id="admin-login-btn" onclick="openAdminMode()">دخول المشرفين</button>
    </header>

    <main class="gallery-container" id="perfumes-container">
        <div class="loading">جاري تحميل العطور...</div>
    </main>

    <script>
        // إعدادات GitHub الخاصة بك
        const GITHUB_USERNAME = "mrlight4321"; // اسمك على جيت هب
        const REPO_NAME = "sfaa-eldhb";      // اسم المستودع
        const FILE_PATH = "perfumes.json";   // ملف JSON الخارجي الذي سيحفظ المنتجات
        const GITHUB_TOKEN = "ضع_التوكن_الخاص_بك_هنا"; // ضع الرمز الذي استخرجته بين علامتي التنصيص
        const ADMIN_PASSWORD = "alnada123";  // كلمة مرور المشرفين

        let perfumes = [];
        let fileSha = ""; // ضروري لتحديث الملفات عبر جيت هب API

        // جلب قائمة العطور من ملف JSON في المستودع
        async function fetchPerfumes() {
            try {
                let response = await fetch(`https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/main/${FILE_PATH}?t=${new Date().getTime()}`);
                if (response.ok) {
                    perfumes = await response.json();
                } else {
                    // إذا لم يكن الملف موجوداً مسبقاً، ننشئ قائمة افتراضية
                    perfumes = [
                        { id: 8, title: "عطر صفاء الذهب (8)", image: "perfume8.jpg" },
                        { id: 9, title: "عطر صفاء الذهب (9)", image: "perfume9.jpg" },
                        { id: 10, title: "عطر صفاء الذهب (10)", image: "perfume10.jpg" }
                    ];
                }
                renderPerfumes();
            } catch (error) {
                console.error("خطأ في جلب البيانات:", error);
                document.getElementById('perfumes-container').innerHTML = '<div class="loading">عذراً، حدث خطأ في تحميل العطور.</div>';
            }
        }

        // عرض العطور في الصفحة
        function renderPerfumes() {
            const container = document.getElementById('perfumes-container');
            if (perfumes.length === 0) {
                container.innerHTML = '<div class="loading">لا توجد عطور متاحة حالياً.</div>';
                return;
            }

            let html = '';
            perfumes.forEach(p => {
                html += `
                    <div class="perfume-card" data-id="${p.id}">
                        <div class="image-box">
                            <img src="${p.image}" alt="${p.title}" onerror="this.src='https://via.placeholder.com/250x350?text=Perfume'">
                        </div>
                        <div class="admin-controls">
                            <button class="delete-btn" onclick="deletePerfume(${p.id})">حذف العطر</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // فتح وضع الإشراف
        function openAdminMode() {
            let pass = prompt("الرجاء إدخال كلمة مرور المشرف:");
            if (pass === ADMIN_PASSWORD) {
                document.body.classList.add('admin-mode');
                document.getElementById('admin-login-btn').textContent = "وضع الإشراف مفعل";
                document.getElementById('admin-login-btn').style.color = "#d4af37";
                document.getElementById('admin-login-btn').style.borderColor = "#d4af37";
                alert("تم تسجيل الدخول بنجاح.");
            } else if (pass !== null) {
                alert("كلمة المرور غير صحيحة!");
            }
        }

        // دالة الحذف وتحديث المستودع على GitHub تلقائياً
        async function deletePerfume(id) {
            if (!confirm('هل أنت متأكد من رغبتك في حذف هذا العطر نهائياً؟')) return;

            // تصفية المنتجات وحذف العنصر المطلوب
            let updatedPerfumes = perfumes.filter(p => p.id !== id);

            try {
                // 1. جلب الـ SHA الخاص بملف JSON الحالي (شرط أساسي لتعديل أي ملف في GitHub API)
                let shaRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    headers: { "Authorization": `token ${GITHUB_TOKEN}` }
                });
                
                if (shaRes.ok) {
                    let fileData = await shaRes.json();
                    fileSha = fileData.sha;
                }

                // 2. إرسال البيانات المحدثة إلى GitHub لتعديل الملف فوراً
                let updateRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${GITHUB_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: `Delete perfume id ${id} by admin`,
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(updatedPerfumes, null, 2)))), // تشفر الملف بصيغة Base64
                        sha: fileSha
                    })
                });

                if (updateRes.ok) {
                    perfumes = updatedPerfumes;
                    renderPerfumes();
                    alert('تم حذف العطر وتحديث الموقع بنجاح! (سيظهر التعديل للزوار بعد ثوانٍ قليلة عند تحديث الصفحات)');
                } else {
                    alert('فشل في حفظ التعديل على جيت هب، تأكد من صحة الـ Token.');
                }
            } catch (err) {
                console.error(err);
                alert('حدث خطأ أثناء الاتصال بـ GitHub.');
            }
        }

        // تشغيل الجلب عند فتح الصفحة
        window.onload = fetchPerfumes;
    </script>
</body>
</html>
